name: Build APK (Cloud)

# 手动触发：Actions 页面 → 左侧 "Build APK (Cloud)" → Run workflow
# 或 push 到 main/master 分支自动触发
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 使用 GitHub runner 自带的 Android SDK (/usr/local/lib/android/sdk)
      - name: Fix SDK env vars (统一 SDK 路径)
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" >> "$GITHUB_ENV"

      - name: Accept SDK licenses
        run: |
          sudo mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" | sudo tee -a "$ANDROID_HOME/licenses/android-sdk-license" > /dev/null
          echo "84831b9409646a918e30573bab4c9c91346d8abd" | sudo tee "$ANDROID_HOME/licenses/android-sdk-preview-license" > /dev/null
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" | sudo tee "$ANDROID_HOME/licenses/intel-android-extra-license" > /dev/null
          sudo chmod -R a+r "$ANDROID_HOME/licenses"
          echo "license 写入完成"

      - name: Install Platform 32 / NDK 24 / CMake (补装缺失组件)
        run: |
          $SDKMANAGER --install "platform-tools" \
            "platforms;android-32" \
            "build-tools;33.0.1" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"
          $SDKMANAGER --list_installed | grep -E "platforms;android-32|ndk;24.0.8215888|cmake;3.22.1"

      - name: Build debug APK (自带 fake.jks 签名)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
