name: Build APK (Cloud)

# 手动触发：Actions 页面 → 左侧 "Build APK (Cloud)" → Run workflow
# 或 push 到 main/master 分支自动触发
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (cmdline-tools)
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept SDK licenses (直接写 license 文件)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >  "$ANDROID_HOME/licenses/android-sdk-license"
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >  "$ANDROID_HOME/licenses/android-sdk-preview-license"
          echo "d975f751698a77b662f1254ddbeed3901e976f5a" >  "$ANDROID_HOME/licenses/intel-android-extra-license"
          echo "license 文件写入完成:"
          ls -la "$ANDROID_HOME/licenses"

      - name: Install Platform 32 / NDK 24 / CMake
        run: |
          sdkmanager --install "platform-tools" \
            "platforms;android-32" \
            "build-tools;33.0.1" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"
          sdkmanager --list_installed | grep -E "platforms;android-32|ndk;24.0.8215888|cmake;3.22.1"

      - name: Build debug APK (自带 fake.jks 签名)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
