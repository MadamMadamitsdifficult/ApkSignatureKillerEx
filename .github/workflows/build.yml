name: Build APK (Cloud)

# 手动触发：Actions 页面 → 左侧 "Build APK (Cloud)" → Run workflow
# 或 push 到 main/master 分支自动触发
on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK (cmdline-tools)
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -sL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Platform 32 / NDK 24 / CMake
        run: |
          sdkmanager --install "platform-tools" \
            "platforms;android-32" \
            "build-tools;33.0.1" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"
          sdkmanager --list_installed | grep -E "platforms;android-32|ndk;24.0.8215888|cmake;3.22.1"

      - name: Build debug APK (自带 fake.jks 签名)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signed-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
